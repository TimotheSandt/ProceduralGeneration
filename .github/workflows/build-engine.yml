name: Build & Release Engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            triplet: x64-mingw-static
            msystem: MINGW64
            exe_ext: .exe

          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
            triplet: x64-linux
            exe_ext: ""

          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
            triplet: arm64-osx
            exe_ext: ""

          - name: macOS x64
            os: macos-13
            platform: macos-x64
            triplet: x64-osx
            exe_ext: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo-tools
          key: cargo-${{ matrix.platform }}-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-

      # ── Windows: MSYS2 + MinGW64 ───────────────────────────────────────────────
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git
            zip
            unzip
            tar

      # ── Linux: system packages ─────────────────────────────────────────────────
      - name: Setup Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl zip unzip tar git \
            pkg-config cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      # ── macOS: ensure tools ────────────────────────────────────────────────────
      - name: Setup macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja cmake zip

      # ── vcpkg bootstrap ────────────────────────────────────────────────────────
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      # ── vcpkg cache ────────────────────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg_installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('Libraries/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      # ── Install vcpkg dependencies ─────────────────────────────────────────────
      - name: Install vcpkg dependencies (Unix)
        if: runner.os != 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=Libraries \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=Libraries \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      # ── Build dist package + engine tool ───────────────────────────────────────
      # 'engine-tool' builds debug+release archives, packages the dist/, and
      # compiles the standalone engine binary (embeds dist/ without vcpkg_installed).
      - name: Build engine tool (Unix)
        if: runner.os != 'Windows'
        run: |
          make -f Libraries/Makefile engine-tool \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      - name: Build engine tool (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mingw32-make -f Libraries/Makefile engine-tool \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      # ── Package artifacts ──────────────────────────────────────────────────────
      # Produces per platform:
      #   engine-<platform>[.exe]      — standalone engine tool (self-contained, embeds dist/)
      #   engine-pkg-<platform>.zip    — package only: headers, libs, make/, tools/, vcpkg.json
      #                                  (vcpkg_installed/ is populated by 'make install' in the user's project)
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          PLAT="${{ matrix.platform }}"
          cp "dist/engine-$PLAT/engine" "dist/engine-$PLAT"
          cd "dist/engine-$PLAT" && zip -r "../../dist/engine-pkg-$PLAT.zip" "dist/"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plat = "${{ matrix.platform }}"
          Copy-Item "dist\engine-$plat\engine.exe" "dist\engine-$plat.exe"
          Compress-Archive -Force -Path "dist\engine-$plat\dist" `
            -DestinationPath "dist\engine-pkg-$plat.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: |
            dist/engine-${{ matrix.platform }}${{ matrix.exe_ext }}
            dist/engine-pkg-${{ matrix.platform }}.zip
          retention-days: 7

  # ── GitHub Release ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Engine ${{ github.ref_name }}"
          body: |
            ## C++ Game Engine — ${{ github.ref_name }}

            ### Download

            | Platform | Engine tool | Package only |
            |---|---|---|
            | Windows x64 (MinGW) | `engine-windows-x64.exe` | `engine-pkg-windows-x64.zip` |
            | Linux x64           | `engine-linux-x64`       | `engine-pkg-linux-x64.zip`   |
            | macOS arm64 (M1+)   | `engine-macos-arm64`     | `engine-pkg-macos-arm64.zip` |
            | macOS x64 (Intel)   | `engine-macos-x64`       | `engine-pkg-macos-x64.zip`   |

            **Engine tool** — binary standalone qui scaffolde de nouveaux projets et met à jour les existants.
            ```sh
            ./engine init myproject
            cd myproject && make debug
            ```

            **Package only** — headers, libs pre-built, `engine.mk`, tools, and `vcpkg.json`. Run `make install` in your project to populate `engine/vcpkg_installed/` automatically.
          generate_release_notes: true
          files: dist/*
